name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cài Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK (release – đã tối ưu dung lượng)
        run: |
          set -o pipefail
          gradle :app:assembleRelease 2>&1 | tee build.log

      - name: Báo lỗi biên dịch (nếu có)
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not|FAILED" build.log | head -60 > errors.txt || true
          [ -s errors.txt ] || tail -60 build.log > errors.txt
          i=0
          while IFS= read -r line; do
            i=$((i+1)); [ $i -gt 45 ] && break
            echo "::error::${line//%/%25}"
          done < errors.txt

      - name: Đổi tên APK
        run: cp app/build/outputs/apk/release/app-release.apk eCard.apk

      - name: Tải APK lên mục Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eCard-apk
          path: eCard.apk
          retention-days: 7

      - name: Đăng APK lên Releases (link tải trực tiếp)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest eCard.apk \
            --title "eCard - Tự Tạo Thiệp – bản mới nhất" \
            --notes "Build tự động từ commit ${GITHUB_SHA::7}. Tải eCard.apk và cài trực tiếp trên điện thoại."
