# Build trên máy chủ GitHub:
#  - eCard.apk : cài tay lên điện thoại (khoá cố định trong repo)
#  - eCard.aab : tải lên Google Play (ký bằng khoá tải lên lấy từ GitHub Secrets)
name: Build APK + AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cài Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build APK (release – cài tay)
        run: |
          set -o pipefail
          gradle :app:assembleGithub 2>&1 | tee build.log

      - name: Ảnh xem trước khung thiệp (Robolectric)
        continue-on-error: true
        run: |
          gradle :app:testDebugUnitTest --tests "vn.ecard.app.RenderPreviewTest" --tests "vn.ecard.app.PaintingPreviewTest" 2>&1 | tail -60
          pip install -q pillow || true
          python3 .github/scripts/contact.py app/build/previews previews.png || true
          python3 .github/scripts/contact.py app/build/previews_paint paintings.png || true
          ls -la previews.png app/build/previews || true

      - name: Giải mã khoá tải lên (nếu đã cài Secrets)
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Chưa cài 4 secrets ANDROID_* -> bỏ qua bản AAB cho Google Play."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build AAB cho Google Play
        if: steps.key.outputs.ok == 'true'
        env:
          SIGN_WITH_UPLOAD: "1"
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle :app:bundleRelease 2>&1 | tee -a build.log
          cp app/build/outputs/bundle/release/app-release.aab eCard.aab

      - name: Báo lỗi biên dịch (nếu có)
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not|FAILED" build.log | head -60 > errors.txt || true
          [ -s errors.txt ] || tail -60 build.log > errors.txt
          i=0
          while IFS= read -r line; do
            i=$((i+1)); [ $i -gt 45 ] && break
            echo "::error::${line//%/%25}"
          done < errors.txt

      - name: Đổi tên APK
        run: cp app/build/outputs/apk/github/app-github.apk eCard.apk

      - name: Tải lên mục Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eCard-build
          path: |
            eCard.apk
            eCard.aab
          if-no-files-found: ignore
          retention-days: 7

      - name: Đăng lên Releases (link tải trực tiếp)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          FILES="eCard.apk"; [ -f eCard.aab ] && FILES="$FILES eCard.aab"; [ -f previews.png ] && FILES="$FILES previews.png"; [ -f paintings.png ] && FILES="$FILES paintings.png"
          gh release create latest $FILES \
            --title "eCard - Tự Tạo Thiệp – bản ${GITHUB_RUN_NUMBER}" \
            --notes "Build tự động từ commit ${GITHUB_SHA::7} (versionCode ${GITHUB_RUN_NUMBER}).
          - eCard.apk: bản GitHub \"eCard (GitHub)\", cài song song với bản Google Play.
          - eCard.aab: tải lên Google Play Console (kiểm thử kín / phát hành)."
